<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
    <!-- Page info and stylesheets -->
    <title>knockout</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!-- Unity canvas -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <!-- Unity loader script -->
<script>
const unityApp = {

    applyCommonFixes: function () {
        window.addEventListener("wheel", function (event) {
            event.preventDefault();
        }, { passive: false });

        window.addEventListener("keydown", function (event) {
            if (["ArrowUp", "ArrowDown"].includes(event.key)) {
                event.preventDefault();
            }
        });

        window.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });
    },

    tryRotationLock: function () {
        // No rotation lock configured.
    },

    tryLockAspectRatio: function () {
        // No aspect ratio configured.
    },

    loadSplitWasm: async function (buildUrl, wasmFile, partCount) {

        const parts = [];

        for (let i = 1; i <= partCount; i++) {

            const partName =
                wasmFile + ".part" + String(i).padStart(2, "0");

            const url =
                buildUrl + "/" + partName;

            console.log("Loading:", url);

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Failed to load " +
                    partName +
                    " (" +
                    response.status +
                    ")"
                );
            }

            const buffer =
                await response.arrayBuffer();

            const part =
                new Uint8Array(buffer);

            console.log(
                partName +
                " size:",
                part.byteLength
            );

            console.log(
                partName +
                " first bytes:",
                [...part.slice(0, 8)]
                    .map(function (x) {
                        return x
                            .toString(16)
                            .padStart(2, "0");
                    })
                    .join(" ")
            );

            parts.push(part);
        }

        /*
         * Calculate combined size.
         */
        let totalSize = 0;

        for (const part of parts) {
            totalSize += part.byteLength;
        }

        console.log(
            "Total WASM size:",
            totalSize
        );

        /*
         * Combine all parts.
         */
        const wasm =
            new Uint8Array(totalSize);

        let offset = 0;

        for (const part of parts) {

            wasm.set(
                part,
                offset
            );

            offset += part.byteLength;
        }

        /*
         * Check WASM magic header.
         *
         * WASM must begin with:
         *
         * 00 61 73 6D
         */
        const header =
            [...wasm.slice(0, 8)]
                .map(function (x) {
                    return x
                        .toString(16)
                        .padStart(2, "0");
                })
                .join(" ");

        console.log(
            "Combined WASM header:",
            header
        );

        if (
            wasm[0] !== 0x00 ||
            wasm[1] !== 0x61 ||
            wasm[2] !== 0x73 ||
            wasm[3] !== 0x6D
        ) {

            throw new Error(
                "Combined file is NOT WASM.\n\n" +
                "Header: " +
                header +
                "\n\n" +
                "Expected: 00 61 73 6d\n\n" +
                "If you see 52 61 72 21, " +
                "your .part files are RAR files."
            );
        }

        console.log(
            "SUCCESS: Valid WASM!"
        );

        return wasm;
    },

    startLoading: async function () {

        const canvas =
            document.querySelector(
                "#unity-canvas"
            );

        const loadingBar =
            document.querySelector(
                "#unity-loading-bar"
            );

        const progressBarFull =
            document.querySelector(
                "#unity-progress-bar-full"
            );

        const buildUrl = "Build";

        const wasmFile =
            "knockout[8]-mirraSDK[5.1.2].wasm";

        const wasmParts = 4;

        const loaderUrl =
            buildUrl +
            "/knockout[8]-mirraSDK[5.1.2].loader.js";

        loadingBar.style.display =
            "block";

        try {

            /*
             * Download and combine
             * part01 -> part04.
             */
            const wasmBuffer =
                await this.loadSplitWasm(
                    buildUrl,
                    wasmFile,
                    wasmParts
                );

            /*
             * Make a Blob containing
             * the reconstructed WASM.
             */
            const wasmBlob =
                new Blob(
                    [wasmBuffer],
                    {
                        type: "application/wasm"
                    }
                );

            /*
             * Create a temporary URL.
             */
            const wasmUrl =
                URL.createObjectURL(
                    wasmBlob
                );

            console.log(
                "Created WASM Blob:",
                wasmUrl
            );

            /*
             * Unity configuration.
             */
            const config = {

                arguments: [],

                dataUrl:
                    buildUrl +
                    "/knockout[8]-mirraSDK[5.1.2].data.br",

                frameworkUrl:
                    buildUrl +
                    "/knockout[8]-mirraSDK[5.1.2].framework.js.br",

                /*
                 * Use reconstructed WASM.
                 */
                codeUrl:
                    wasmUrl,

                streamingAssetsUrl:
                    "StreamingAssets",

                companyName:
                    "DefaultCompany",

                productName:
                    "knockout",

                productVersion:
                    "0.1.0",

                matchWebGLToCanvasSize:
                    true,

                showBanner:
                    function (msg, type) {

                        if (type === "error") {
                            console.error(msg);
                        } else {
                            console.warn(msg);
                        }

                    }
            };

            /*
             * Load Unity loader.
             */
            const script =
                document.createElement(
                    "script"
                );

            script.src =
                loaderUrl;

            script.onload =
                function () {

                    console.log(
                        "Unity loader loaded."
                    );

                    createUnityInstance(
                        canvas,
                        config,
                        function (progress) {

                            progressBarFull.style.width =
                                (progress * 100) + "%";

                        }
                    )
                    .then(
                        function (unityInstance) {

                            console.log(
                                "Unity loaded successfully!"
                            );

                            loadingBar.style.display =
                                "none";

                        }
                    )
                    .catch(
                        function (error) {

                            console.error(
                                "Unity failed:",
                                error
                            );

                            loadingBar.style.display =
                                "none";

                        }
                    );
                };

            script.onerror =
                function () {

                    throw new Error(
                        "Failed to load Unity loader:\n" +
                        loaderUrl
                    );

                };

            document.body.appendChild(
                script
            );

        } catch (error) {

            console.error(
                "Failed to load split WASM:",
                error
            );

            loadingBar.style.display =
                "none";

            alert(
                "Failed to load WASM:\n\n" +
                error.message
            );
        }
    },

    isMobile: function () {
        return /iPhone|iPad|iPod|Android/i.test(
            navigator.userAgent
        );
    },

    isEmpty: function (value) {
        return (
            value === undefined ||
            value === null ||
            value === ""
        );
    },

    toBoolean: function (value) {
        return (
            value === true ||
            value === "true" ||
            value === 1 ||
            value === "1" ||
            value === "True"
        );
    },

    isNumber: function (value) {
        return (
            typeof value === "number" &&
            !isNaN(value)
        );
    },

    toNumber: function (value) {

        if (this.isNumber(value)) {
            return value;
        }

        if (this.isEmpty(value)) {
            return 0;
        }

        const str =
            String(value).trim();

        if (str === "") {
            return 0;
        }

        const num =
            parseFloat(str);

        return isNaN(num)
            ? 0
            : num;
    }
};


/*
 * Start Unity.
 */
unityApp.applyCommonFixes();

unityApp.tryRotationLock();

unityApp.tryLockAspectRatio();

unityApp.startLoading();

</script>
  </body>
</html>
