<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
    <!-- Page info and stylesheets -->
    <title>knockout</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!-- Unity canvas -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <!-- Unity loader script -->
<script>
const unityApp = {

    applyCommonFixes: function () {
        window.addEventListener("wheel", function (event) {
            event.preventDefault();
        }, { passive: false });

        window.addEventListener("keydown", function (event) {
            if (["ArrowUp", "ArrowDown"].includes(event.key)) {
                event.preventDefault();
            }
        });

        window.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });
    },

    tryRotationLock: function () {
        // No rotation lock configured.
    },

    tryLockAspectRatio: function () {
        // No aspect ratio configured.
    },

    loadSplitWasm: async function (buildUrl, wasmFile, partCount) {
        const parts = [];

        for (let i = 1; i <= partCount; i++) {
            const partName =
                wasmFile + ".part" + String(i).padStart(2, "0");

            console.log("Loading:", partName);

            const response = await fetch(
                buildUrl + "/" + partName
            );

            if (!response.ok) {
                throw new Error(
                    "Failed to load " +
                    partName +
                    " (" +
                    response.status +
                    ")"
                );
            }

            const data = await response.arrayBuffer();

            parts.push(new Uint8Array(data));
        }

        let totalSize = 0;

        for (const part of parts) {
            totalSize += part.byteLength;
        }

        const wasm = new Uint8Array(totalSize);

        let offset = 0;

        for (const part of parts) {
            wasm.set(part, offset);
            offset += part.byteLength;
        }

        console.log(
            "Combined WASM size:",
            wasm.byteLength
        );

        console.log(
            "WASM header:",
            [...wasm.slice(0, 4)]
                .map(function (x) {
                    return x.toString(16).padStart(2, "0");
                })
                .join(" ")
        );

        // WASM magic number = 00 61 73 6D
        if (
            wasm[0] !== 0x00 ||
            wasm[1] !== 0x61 ||
            wasm[2] !== 0x73 ||
            wasm[3] !== 0x6D
        ) {
            throw new Error(
                "Combined file is not valid WASM. Header: " +
                [...wasm.slice(0, 4)]
                    .map(function (x) {
                        return x.toString(16).padStart(2, "0");
                    })
                    .join(" ")
            );
        }

        console.log("Valid WASM!");

        return wasm;
    },

    startLoading: async function () {

        const canvas =
            document.querySelector("#unity-canvas");

        const loadingBar =
            document.querySelector("#unity-loading-bar");

        const progressBarFull =
            document.querySelector("#unity-progress-bar-full");

        const buildUrl = "Build";

        const wasmFile =
            "knockout[8]-mirraSDK[5.1.2].wasm";

        const wasmParts = 4;

        const loaderUrl =
            buildUrl +
            "/knockout[8]-mirraSDK[5.1.2].loader.js";

        loadingBar.style.display = "block";

        try {

            /*
             * Download .part01 -> .part04
             * and combine them back into the WASM.
             */
            const wasmBuffer =
                await this.loadSplitWasm(
                    buildUrl,
                    wasmFile,
                    wasmParts
                );

            /*
             * Create a temporary Blob URL.
             */
            const wasmBlob = new Blob(
                [wasmBuffer],
                {
                    type: "application/wasm"
                }
            );

            const wasmUrl =
                URL.createObjectURL(wasmBlob);

            console.log(
                "WASM Blob URL:",
                wasmUrl
            );

            const config = {

                arguments: [],

                dataUrl:
                    buildUrl +
                    "/knockout[8]-mirraSDK[5.1.2].data.br",

                frameworkUrl:
                    buildUrl +
                    "/knockout[8]-mirraSDK[5.1.2].framework.js.br",

                /*
                 * IMPORTANT:
                 * Unity will load the combined WASM
                 * from this Blob URL.
                 */
                codeUrl: wasmUrl,

                streamingAssetsUrl:
                    "StreamingAssets",

                companyName:
                    "DefaultCompany",

                productName:
                    "knockout",

                productVersion:
                    "0.1.0",

                matchWebGLToCanvasSize:
                    true,

                showBanner:
                    function (msg, type) {

                        if (type === "error") {
                            console.error(msg);
                        } else {
                            console.warn(msg);
                        }

                    }
            };

            /*
             * Load Unity's loader.
             */
            const script =
                document.createElement("script");

            script.src = loaderUrl;

            script.onload =
                function () {

                    console.log(
                        "Unity loader loaded."
                    );

                    createUnityInstance(
                        canvas,
                        config,
                        function (progress) {

                            progressBarFull.style.width =
                                (100 * progress) + "%";

                        }
                    )
                    .then(
                        function (unityInstance) {

                            console.log(
                                "Unity loaded!"
                            );

                            loadingBar.style.display =
                                "none";

                        }
                    )
                    .catch(
                        function (message) {

                            console.error(
                                "Unity error:",
                                message
                            );

                            alert(message);

                        }
                    );

                };

            script.onerror =
                function () {

                    throw new Error(
                        "Failed to load Unity loader: " +
                        loaderUrl
                    );

                };

            document.body.appendChild(script);

        } catch (error) {

            console.error(
                "Failed to load split WASM:",
                error
            );

            loadingBar.style.display =
                "none";

            alert(
                "Failed to load WASM:\n" +
                error.message
            );
        }
    },

    isMobile: function () {
        return /iPhone|iPad|iPod|Android/i.test(
            navigator.userAgent
        );
    },

    isEmpty: function (value) {
        return (
            value === undefined ||
            value === null ||
            value === ""
        );
    },

    toBoolean: function (value) {
        return (
            value === true ||
            value === "true" ||
            value === 1 ||
            value === "1" ||
            value === "True"
        );
    },

    isNumber: function (value) {
        return (
            typeof value === "number" &&
            !isNaN(value)
        );
    },

    toNumber: function (value) {

        if (this.isNumber(value)) {
            return value;
        }

        if (this.isEmpty(value)) {
            return 0;
        }

        const str =
            String(value).trim();

        if (str === "") {
            return 0;
        }

        const num =
            parseFloat(str);

        return isNaN(num) ? 0 : num;
    }
};


/*
 * Start Unity.
 */
unityApp.applyCommonFixes();

unityApp.tryRotationLock();

unityApp.tryLockAspectRatio();

unityApp.startLoading();

</script>
  </body>
</html>
