<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 shrink-to-fit=yes"
    >

    <title>knockout</title>

    <link
        rel="shortcut icon"
        href="TemplateData/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="TemplateData/style.css"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >
</head>

<body>

<div id="unity-container">

    <canvas
        id="unity-canvas"
        tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">

        <div id="unity-logo"></div>

        <div id="unity-progress-bar-empty">

            <div id="unity-progress-bar-full"></div>

        </div>

    </div>

</div>


<!--
    Browser RAR extractor.

    This library is used to read the reconstructed RAR archive.
-->
<script src="https://unpkg.com/unrarit@0.0.5/dist/unrarit.umd.js"></script>


<script>

const unityApp = {

    applyCommonFixes: function () {

        window.addEventListener(
            "wheel",
            function (event) {
                event.preventDefault();
            },
            { passive: false }
        );

        window.addEventListener(
            "keydown",
            function (event) {

                if (
                    ["ArrowUp", "ArrowDown"]
                    .includes(event.key)
                ) {
                    event.preventDefault();
                }

            }
        );

        window.addEventListener(
            "contextmenu",
            function (event) {
                event.preventDefault();
            }
        );

    },


    tryRotationLock: function () {
    },


    tryLockAspectRatio: function () {
    },


    /*
     * ---------------------------------------------------------
     * DOWNLOAD RAR PARTS
     * ---------------------------------------------------------
     */

    loadRarParts: async function (
        buildUrl,
        archiveName,
        partCount
    ) {

        const parts = [];

        for (
            let i = 1;
            i <= partCount;
            i++
        ) {

            const partName =
                archiveName +
                ".part" +
                String(i).padStart(2, "0");

            const url =
                buildUrl +
                "/" +
                partName;

            console.log(
                "[RAR] Loading:",
                url
            );

            const response =
                await fetch(url);

            if (!response.ok) {

                throw new Error(
                    "Failed to load " +
                    partName +
                    " HTTP " +
                    response.status
                );

            }

            const bytes =
                new Uint8Array(
                    await response.arrayBuffer()
                );

            console.log(
                "[RAR]",
                partName,
                "size:",
                bytes.length
            );

            /*
             * Print first bytes for debugging.
             */

            console.log(
                "[RAR]",
                partName,
                "header:",
                Array.from(
                    bytes.slice(0, 8)
                )
                .map(function (x) {
                    return x
                        .toString(16)
                        .padStart(2, "0");
                })
                .join(" ")
            );

            parts.push(bytes);

        }


        /*
         * Calculate combined archive size.
         */

        let totalSize = 0;

        for (
            let i = 0;
            i < parts.length;
            i++
        ) {

            totalSize +=
                parts[i].length;

        }


        console.log(
            "[RAR] Combined size:",
            totalSize
        );


        /*
         * Combine all RAR volumes.
         */

        const combined =
            new Uint8Array(
                totalSize
            );

        let offset = 0;

        for (
            let i = 0;
            i < parts.length;
            i++
        ) {

            combined.set(
                parts[i],
                offset
            );

            offset +=
                parts[i].length;

        }


        /*
         * Verify RAR5 signature.
         *
         * RAR5:
         *
         * 52 61 72 21
         * 1A 07 01 00
         */

        const header =
            Array.from(
                combined.slice(0, 8)
            )
            .map(function (x) {

                return x
                    .toString(16)
                    .padStart(2, "0");

            })
            .join(" ");


        console.log(
            "[RAR] Combined header:",
            header
        );


        if (
            combined[0] !== 0x52 ||
            combined[1] !== 0x61 ||
            combined[2] !== 0x72 ||
            combined[3] !== 0x21
        ) {

            throw new Error(
                "The combined file is not RAR.\n\n" +
                "Header: " +
                header
            );

        }


        console.log(
            "[RAR] RAR archive reconstructed successfully."
        );


        return combined;

    },


    /*
     * ---------------------------------------------------------
     * EXTRACT WASM FROM RAR
     * ---------------------------------------------------------
     */

    extractWasm: async function (
        rarBytes
    ) {

        console.log(
            "[RAR] Starting RAR extraction..."
        );


        /*
         * unrarit accepts a TypedArray.
         */

const result = await unrarit.unrar(rarBytes);


        console.log(
            "[RAR] Archive opened."
        );


        const entries =
            result.entries;


        const names =
            Object.keys(entries);


        console.log(
            "[RAR] Files inside archive:"
        );


        for (
            const name of names
        ) {

            console.log(
                "  ",
                name,
                entries[name].size,
                "bytes"
            );

        }


        /*
         * Find a WASM file.
         */

        let wasmEntry = null;
        let wasmName = null;


        for (
            const name of names
        ) {

            if (
                name
                    .toLowerCase()
                    .endsWith(".wasm")
            ) {

                wasmEntry =
                    entries[name];

                wasmName =
                    name;

                break;

            }

        }


        if (!wasmEntry) {

            throw new Error(
                "No .wasm file was found inside the RAR archive."
            );

        }


        console.log(
            "[RAR] Found WASM:",
            wasmName
        );


        console.log(
            "[RAR] Extracting WASM..."
        );


        const wasmBuffer =
            await wasmEntry.arrayBuffer();


        const wasmBytes =
            new Uint8Array(
                wasmBuffer
            );


        console.log(
            "[RAR] Extracted WASM size:",
            wasmBytes.length
        );


        /*
         * Verify actual WASM header.
         *
         * WASM:
         *
         * 00 61 73 6D
         */

        const wasmHeader =
            Array.from(
                wasmBytes.slice(0, 8)
            )
            .map(function (x) {

                return x
                    .toString(16)
                    .padStart(2, "0");

            })
            .join(" ");


        console.log(
            "[WASM] Header:",
            wasmHeader
        );


        if (
            wasmBytes[0] !== 0x00 ||
            wasmBytes[1] !== 0x61 ||
            wasmBytes[2] !== 0x73 ||
            wasmBytes[3] !== 0x6d
        ) {

            throw new Error(
                "Extracted file is not valid WASM.\n\n" +
                "Header: " +
                wasmHeader
            );

        }


        console.log(
            "[WASM] Valid WASM found!"
        );


        return wasmBytes;

    },


    /*
     * ---------------------------------------------------------
     * START UNITY
     * ---------------------------------------------------------
     */

    startLoading: async function () {

        const canvas =
            document.querySelector(
                "#unity-canvas"
            );


        const loadingBar =
            document.querySelector(
                "#unity-loading-bar"
            );


        const progressBarFull =
            document.querySelector(
                "#unity-progress-bar-full"
            );


        const buildUrl =
            "Build";


        /*
         * IMPORTANT:
         *
         * This is the base name of your RAR parts.
         *
         * If your actual files are:
         *
         * knockout[8]-mirraSDK[5.1.2].wasm.part01
         *
         * then leave this exactly as shown.
         */

        const archiveName =
            "knockout[8]-mirraSDK[5.1.2].wasm";


        const archiveParts =
            4;


        const loaderUrl =
            buildUrl +
            "/knockout[8]-mirraSDK[5.1.2].loader.js";


        loadingBar.style.display =
            "block";


        try {

            /*
             * -------------------------------------------------
             * STEP 1
             *
             * Download .part01 -> .part04
             * -------------------------------------------------
             */

            const rarBytes =
                await this.loadRarParts(
                    buildUrl,
                    archiveName,
                    archiveParts
                );


            /*
             * -------------------------------------------------
             * STEP 2
             *
             * Extract WASM from RAR5
             * -------------------------------------------------
             */

            const wasmBytes =
                await this.extractWasm(
                    rarBytes
                );


            /*
             * -------------------------------------------------
             * STEP 3
             *
             * Create WASM Blob
             * -------------------------------------------------
             */

            const wasmBlob =
                new Blob(
                    [wasmBytes],
                    {
                        type: "application/wasm"
                    }
                );


            /*
             * Create temporary URL.
             */

            const wasmUrl =
                URL.createObjectURL(
                    wasmBlob
                );


            console.log(
                "[WASM] Blob URL:",
                wasmUrl
            );


            /*
             * -------------------------------------------------
             * STEP 4
             *
             * Unity configuration
             * -------------------------------------------------
             */

            const config = {

                arguments: [],


                dataUrl:
                    buildUrl +
                    "/knockout[8]-mirraSDK[5.1.2].data.br",


                frameworkUrl:
                    buildUrl +
                    "/knockout[8]-mirraSDK[5.1.2].framework.js.br",


                /*
                 * This is now the extracted WASM.
                 */

                codeUrl:
                    wasmUrl,


                streamingAssetsUrl:
                    "StreamingAssets",


                companyName:
                    "DefaultCompany",


                productName:
                    "knockout",


                productVersion:
                    "0.1.0",


                matchWebGLToCanvasSize:
                    true,


                showBanner:
                    function (
                        msg,
                        type
                    ) {

                        if (
                            type === "error"
                        ) {

                            console.error(
                                "[Unity]",
                                msg
                            );

                        } else {

                            console.warn(
                                "[Unity]",
                                msg
                            );

                        }

                    }

            };


            /*
             * -------------------------------------------------
             * STEP 5
             *
             * Load Unity loader
             * -------------------------------------------------
             */

            const script =
                document.createElement(
                    "script"
                );


            script.src =
                loaderUrl;


            script.onload =
                function () {

                    console.log(
                        "Unity loader loaded."
                    );


                    createUnityInstance(
                        canvas,
                        config,
                        function (progress) {

                            progressBarFull.style.width =
                                (
                                    progress *
                                    100
                                ) +
                                "%";

                        }
                    )

                    .then(
                        function (
                            unityInstance
                        ) {

                            console.log(
                                "Unity loaded successfully!"
                            );


                            loadingBar.style.display =
                                "none";

                        }
                    )

                    .catch(
                        function (
                            error
                        ) {

                            console.error(
                                "Unity failed:",
                                error
                            );


                            loadingBar.style.display =
                                "none";

                        }
                    );

                };


            script.onerror =
                function () {

                    throw new Error(
                        "Failed to load Unity loader:\n" +
                        loaderUrl
                    );

                };


            document.body.appendChild(
                script
            );


        } catch (error) {

            console.error(
                "Failed to load split RAR/WASM:",
                error
            );


            loadingBar.style.display =
                "none";


            alert(
                "Failed to load game:\n\n" +
                error.message
            );

        }

    }

};


/*
 * Start.
 */

unityApp.applyCommonFixes();

unityApp.tryRotationLock();

unityApp.tryLockAspectRatio();

unityApp.startLoading();

</script>

</body>
</html>
