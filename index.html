<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
    <!-- Page info and stylesheets -->
    <title>knockout</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!-- Unity canvas -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <!-- Unity loader script -->
<script>
const unityApp = {

    applyCommonFixes: function () {
        window.addEventListener("wheel", function (event) {
            event.preventDefault();
        }, { passive: false });

        window.addEventListener("keydown", function (event) {
            if (["ArrowUp", "ArrowDown"].includes(event.key)) {
                event.preventDefault();
            }
        });

        window.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });
    },

    tryRotationLock: function () {
    },

    tryLockAspectRatio: function () {
    },

    loadSplitWasm: async function (buildUrl, wasmFile, partCount) {

        const parts = [];

        for (let i = 1; i <= partCount; i++) {

            const partName =
                wasmFile + ".part" + String(i).padStart(2, "0");

            const url =
                buildUrl + "/" + partName;

            console.log("Loading:", url);

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Failed to load " +
                    partName +
                    " HTTP " +
                    response.status
                );
            }

            const buffer =
                await response.arrayBuffer();

            const part =
                new Uint8Array(buffer);

            console.log(
                partName + " size:",
                part.length
            );

            console.log(
                partName + " first bytes:",
                Array.from(part.slice(0, 8))
                    .map(function (x) {
                        return x.toString(16).padStart(2, "0");
                    })
                    .join(" ")
            );

            parts.push(part);
        }

        let totalSize = 0;

        for (let i = 0; i < parts.length; i++) {
            totalSize += parts[i].length;
        }

        console.log(
            "Total reconstructed size:",
            totalSize
        );

        const combined =
            new Uint8Array(totalSize);

        let offset = 0;

        for (let i = 0; i < parts.length; i++) {
            combined.set(parts[i], offset);
            offset += parts[i].length;
        }

        const header =
            Array.from(combined.slice(0, 8))
                .map(function (x) {
                    return x.toString(16).padStart(2, "0");
                })
                .join(" ");

        console.log(
            "Combined header:",
            header
        );

        if (
            combined[0] !== 0x00 ||
            combined[1] !== 0x61 ||
            combined[2] !== 0x73 ||
            combined[3] !== 0x6d
        ) {
            throw new Error(
                "Combined file is NOT WASM.\n\n" +
                "Header: " + header + "\n\n" +
                "Expected: 00 61 73 6d"
            );
        }

        console.log("SUCCESS: Valid WASM!");

        return combined;
    },

    startLoading: async function () {

        const canvas =
            document.querySelector("#unity-canvas");

        const loadingBar =
            document.querySelector("#unity-loading-bar");

        const progressBarFull =
            document.querySelector("#unity-progress-bar-full");

        const buildUrl = "Build";

        const wasmFile =
            "knockout[8]-mirraSDK[5.1.2].wasm";

        const wasmParts = 4;

        const loaderUrl =
            buildUrl +
            "/knockout[8]-mirraSDK[5.1.2].loader.js";

        loadingBar.style.display = "block";

        try {

            const wasmBuffer =
                await this.loadSplitWasm(
                    buildUrl,
                    wasmFile,
                    wasmParts
                );

            const wasmBlob =
                new Blob(
                    [wasmBuffer],
                    {
                        type: "application/wasm"
                    }
                );

            const wasmUrl =
                URL.createObjectURL(wasmBlob);

            console.log(
                "Created WASM Blob:",
                wasmUrl
            );

            const config = {

                arguments: [],

                dataUrl:
                    buildUrl +
                    "/knockout[8]-mirraSDK[5.1.2].data.br",

                frameworkUrl:
                    buildUrl +
                    "/knockout[8]-mirraSDK[5.1.2].framework.js.br",

                codeUrl:
                    wasmUrl,

                streamingAssetsUrl:
                    "StreamingAssets",

                companyName:
                    "DefaultCompany",

                productName:
                    "knockout",

                productVersion:
                    "0.1.0",

                matchWebGLToCanvasSize:
                    true,

                showBanner: function (msg, type) {

                    if (type === "error") {
                        console.error(msg);
                    } else {
                        console.warn(msg);
                    }

                }
            };

            const script =
                document.createElement("script");

            script.src = loaderUrl;

            script.onload = function () {

                console.log(
                    "Unity loader loaded."
                );

                createUnityInstance(
                    canvas,
                    config,
                    function (progress) {

                        progressBarFull.style.width =
                            (progress * 100) + "%";

                    }
                )
                .then(function (unityInstance) {

                    console.log(
                        "Unity loaded successfully!"
                    );

                    loadingBar.style.display =
                        "none";

                })
                .catch(function (error) {

                    console.error(
                        "Unity failed:",
                        error
                    );

                    loadingBar.style.display =
                        "none";

                });

            };

            script.onerror = function () {

                throw new Error(
                    "Failed to load Unity loader:\n" +
                    loaderUrl
                );

            };

            document.body.appendChild(script);

        } catch (error) {

            console.error(
                "Failed to load split WASM:",
                error
            );

            loadingBar.style.display =
                "none";

            alert(
                "Failed to load WASM:\n\n" +
                error.message
            );
        }
    }
};

unityApp.applyCommonFixes();
unityApp.tryRotationLock();
unityApp.tryLockAspectRatio();
unityApp.startLoading();
</script>
  </body>
</html>
